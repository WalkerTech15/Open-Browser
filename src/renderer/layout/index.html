<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Open Browser</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <div class="tab-strip">
      <div id="tab-list" role="group" aria-label="Open tabs"></div>
      <button id="new-tab-button" type="button" aria-label="New tab" title="New tab">+</button>
    </div>
    <header class="toolbar">
      <button id="back-button" aria-label="Go back" disabled>‹</button>
      <button id="forward-button" aria-label="Go forward" disabled>›</button>
      <button id="reload-button" aria-label="Reload" data-mode="reload">↻</button>
      <input id="address-input" aria-label="Address" placeholder="Search or enter address" />
      <button id="profiles-button" type="button" title="Switch or create a profile">Profiles</button>
      <button id="workspaces-button" type="button" title="Save or open a workspace">Workspaces</button>
      <button id="history-button" class="history-toggle" type="button" title="Browsing history">History</button>
    </header>
    <div id="loading-bar"></div>
    <div id="error-banner" role="alert"></div>
    <!-- Loaded as a plain classic script, not a module: the sandboxed
         renderer has no bundler/module loader, so components/toolbar.ts
         must stay import-free. See src/renderer/README.md. -->
    <script src="../../../dist/src/renderer/components/toolbar.js"></script>
  </body>
</html>
