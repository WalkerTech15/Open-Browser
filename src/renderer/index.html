<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <button aria-label="Go back" disabled>‹</button>
      <button aria-label="Go forward" disabled>›</button>
      <button aria-label="Reload" disabled>↻</button>
      <input aria-label="Address" placeholder="Search or enter address" />
      <button aria-label="New tab">+</button>
    </header>
    <main class="empty-state">
      <h1>Open Browser</h1>
      <p>A simple, private browser foundation.</p>
    </main>
  </body>
</html>
