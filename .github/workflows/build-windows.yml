name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        # --publish=never guards against electron-builder auto-publishing a
        # GitHub Release; this workflow only produces a downloadable artifact.
        run: npm run dist -- --publish=never

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-browser-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
